name: yt-transcriber

x-yt-transcriber-common: &yt-transcriber-common
  build:
    context: .
    args:
      PRELOAD_MODELS: "1"
  image: yt-transcriber:cuda12.8
  environment:
    YT_TRANSCRIBER_STATE_BACKEND: json
    YT_TRANSCRIBER_DEVICE: cuda
    YT_TRANSCRIBER_DEMUCS_DEVICE: cuda:1
    YT_TRANSCRIBER_ALIGNMENT_DEVICE: cuda:1
    YT_TRANSCRIBER_COMPUTE_TYPE: int8
    YT_TRANSCRIBER_BATCH_SIZE: "${YT_TRANSCRIBER_BATCH_SIZE:-1}"
    YT_TRANSCRIBER_ROOT_PATH: /yt-transcriber
    YT_TRANSCRIBER_RESULTS_DIR: /data/results
    YT_TRANSCRIBER_WORK_DIR: /data/work
  volumes:
    - ./results:/data/results
    - ./_batch_work:/data/work
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids:
              - "${YT_TRANSCRIBER_GPU_ID:-0}"
              - "${YT_TRANSCRIBER_SECONDARY_GPU_ID:-1}"
            capabilities: [gpu]
  restart: "no"

services:
  yt-transcriber-api:
    <<: *yt-transcriber-common
    container_name: yt-transcriber-api
    hostname: yt-transcriber-api
    command: ["api"]
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  yt-transcriber-batch:
    <<: *yt-transcriber-common
    profiles: ["batch"]
    container_name: yt-transcriber-batch
    hostname: yt-transcriber-batch
    # Reuse the existing external network. This avoids Compose creating a
    # project-default bridge network for each batch run on subnet-exhausted
    # multi-project GPU hosts.
    networks:
      - traefik
    command:
      - batch
      - /data/input/videos.txt
      - --output-dir
      - /data/results
      - --work-root
      - /data/work
      - --state-backend
      - json
      - --device
      - cuda
      - --demucs-device
      - cuda:1
      - --alignment-device
      - cuda:1
      - --compute-type
      - int8
      - --language
      - en
      - --batch-size
      - "${YT_TRANSCRIBER_BATCH_SIZE:-1}"
      - --granularity
      - both
    volumes:
      - ./videos.txt:/data/input/videos.txt:ro
      - ./results:/data/results
      - ./_batch_work:/data/work

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
