name: yt-transcriber-bengee

x-bengee-environment: &bengee-environment
  BENGEE_WORKER_COUNT: "8"
  BENGEE_WHISPER_BATCH_SIZE: "${BENGEE_WHISPER_BATCH_SIZE:-4}"
  BENGEE_WHISPER_MODEL: "${BENGEE_WHISPER_MODEL:-large-v3}"
  BENGEE_COMPUTE_TYPE: "${BENGEE_COMPUTE_TYPE:-int8}"
  BENGEE_LANGUAGE: "${BENGEE_LANGUAGE:-en}"
  BENGEE_GRANULARITY: "${BENGEE_GRANULARITY:-both}"

x-bengee-worker: &bengee-worker
  build:
    context: .
    args:
      PRELOAD_MODELS: "1"
  image: yt-transcriber:cuda12.8
  command: ["bengee-worker", "--retry-failed"]
  # Reuse Docker's built-in bridge. This preserves container isolation and
  # avoids allocating a new subnet on Bengee's exhausted address pools.
  network_mode: bridge
  environment: *bengee-environment
  volumes:
    - ./artifacts/videos_selected_kids_1000.txt:/data/input/videos_kids.txt:ro
    - ./artifacts/videos_selected_youtube_1000.txt:/data/input/videos_normal.txt:ro
    - ./results:/data/results
    - ./_batch_work:/data/work
  restart: "no"

x-gpu-0: &gpu-0
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["${BENGEE_GPU_0:-0}"]
          capabilities: [gpu]
x-gpu-1: &gpu-1
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["${BENGEE_GPU_1:-1}"]
          capabilities: [gpu]
x-gpu-2: &gpu-2
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["${BENGEE_GPU_2:-2}"]
          capabilities: [gpu]
x-gpu-3: &gpu-3
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["${BENGEE_GPU_3:-3}"]
          capabilities: [gpu]

services:
  yt-transcriber-batch-0:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-0
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "0"
    deploy: *gpu-0

  yt-transcriber-batch-1:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-1
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "1"
    deploy: *gpu-0

  yt-transcriber-batch-2:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-2
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "2"
    deploy: *gpu-1

  yt-transcriber-batch-3:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-3
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "3"
    deploy: *gpu-1

  yt-transcriber-batch-4:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-4
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "4"
    deploy: *gpu-2

  yt-transcriber-batch-5:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-5
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "5"
    deploy: *gpu-2

  yt-transcriber-batch-6:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-6
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "6"
    deploy: *gpu-3

  yt-transcriber-batch-7:
    <<: *bengee-worker
    container_name: yt-transcriber-bengee-7
    environment:
      <<: *bengee-environment
      BENGEE_WORKER_INDEX: "7"
    deploy: *gpu-3
