      - "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BENGEE_GPU_2:-2}"]
              capabilities: [gpu]

  yt-transcriber-batch-3:
    <<: *bengee-batch-common
    container_name: yt-transcriber-bengee-3
